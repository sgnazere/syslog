name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: syslog_app
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: syslog_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U syslog_app" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: syslog_ci
      DB_USER: syslog_app
      DB_PASSWORD: ci-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Migrations sur base vide
        run: npm run migrate
        env:
          JWT_SECRET: ci-jwt-secret-0123456789-0123456789
          LICENSE_SECRET: ci-license-secret-0123456789-0123456789
      - name: Tests unitaires et d'intégration
        run: npm test
        env:
          INTEGRATION: '1'
      - run: npm audit --omit=dev --audit-level=critical

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
