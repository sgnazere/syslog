# ============================================================
# SysLog — configuration Nginx de production
#
# Installation :
#   sudo cp deploy/nginx/syslog.conf /etc/nginx/sites-available/syslog
#   (adapter server_name, root et les chemins des certificats)
#   sudo ln -s /etc/nginx/sites-available/syslog /etc/nginx/sites-enabled/
#   sudo certbot --nginx -d syslog.espaceconfiance.ci
#   sudo nginx -t && sudo systemctl reload nginx
#
# Côté API (backend/.env) :
#   FRONTEND_URL=https://syslog.espaceconfiance.ci   (adresse exacte, voir utils/origins.js)
#   TRUST_PROXY=1
# ============================================================

# Toute adresse en HTTP est redirigée vers l'adresse officielle en HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name syslog.espaceconfiance.ci www.syslog.espaceconfiance.ci;
    return 301 https://syslog.espaceconfiance.ci$request_uri;
}

# Variante www en HTTPS → adresse officielle (une seule origine pour la session et l'anti-CSRF)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.syslog.espaceconfiance.ci;
    ssl_certificate     /etc/letsencrypt/live/syslog.espaceconfiance.ci/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/syslog.espaceconfiance.ci/privkey.pem;
    return 301 https://syslog.espaceconfiance.ci$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name syslog.espaceconfiance.ci;

    ssl_certificate     /etc/letsencrypt/live/syslog.espaceconfiance.ci/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/syslog.espaceconfiance.ci/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Ne pas divulguer la version de Nginx
    server_tokens off;

    root  /var/www/syslog/frontend/dist;
    index index.html;

    # ── En-têtes de sécurité de la page ─────────────────────────
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

    # Fichiers du build à nom versionné : mis en cache longtemps
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        # add_header dans un bloc location remplace ceux du serveur : on les répète
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    # Application monopage
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API, webhook et sonde de santé → Node.js (port 5000, jamais exposé directement)
    location ~ ^/(api|webhooks|health) {
        proxy_pass         http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # L'en-tête Origin est transmis tel quel (contrôle anti-CSRF de l'API)
        client_max_body_size 1m;
    }
}
